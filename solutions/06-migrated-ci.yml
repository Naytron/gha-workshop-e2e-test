# Lab 6 solution — the migration-samples pipeline (Jenkins/Azure/GitLab
# versions all describe this same behavior) translated to GitHub Actions:
#   • install → test (matrix) → build, with build depending on test
#   • build only on main            (when { branch } / rules / condition)
#   • nightly cron on weekdays      (Jenkins 'H 2 * * 1-5' → fixed UTC time)
#   • dist/ archived as an artifact (archiveArtifacts / PublishBuildArtifacts)
#   • "finished" log line always runs (post { always })
# Migration bonus: least-privilege permissions + SHA pins — raise the bar
# while you port, don't just copy the old pipeline's habits.
name: Migrated CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1-5" # 02:00 UTC weekdays (cron is always UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrated-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm # carries over the GitLab sample's .npm cache behavior
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - run: npm test

  build:
    name: Build distributable
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - run: npm run build

      - name: Archive dist        # Jenkins archiveArtifacts / GitLab artifacts:
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: app/dist/
          retention-days: 7

  report:
    name: Pipeline finished
    needs: [test, build]
    if: always() # Jenkins post { always } equivalent
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo "Pipeline finished."
          echo "test:  ${{ needs.test.result }}"
          echo "build: ${{ needs.build.result }}"
