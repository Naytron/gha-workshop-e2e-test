# Lab 9 solution — AI summary of failed CI runs, powered by Copilot in Actions.
# Copy to .github/workflows/ci-failure-summary.yml
#
# Runs when the "CI" workflow (Lab 2) completes with a failure. Downloads the
# failed run's logs, feeds the tail through actions/ai-inference (v3 — Copilot
# CLI backend), and publishes a human-friendly diagnosis to the job summary.
#
# REQUIRES ▸ repo secret COPILOT_GITHUB_TOKEN (same PAT as the triage
# workflow — "Copilot Requests: read" only; see Lab 9 §9.1).
#
# Uses `workflow_run` so it works even when CI failed on a fork PR — and gets
# a token that can read logs without granting CI itself anything new.
name: CI Failure Summary

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read # download run logs
  contents: read # read prompts/ from the repo

concurrency:
  group: failure-summary-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  summarize:
    # Only bother the model when the run actually failed.
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Download failed run logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > full.log || true
          # Keep the prompt small: the interesting part is the end of the log.
          tail -c 8000 full.log > excerpt.log
          echo "Captured $(wc -c < excerpt.log) bytes of failing-step log."

      - name: Summarize failure with Copilot
        id: ai
        uses: actions/ai-inference@2c43c91ae16266ca159d311430343c67a5ffa222 # v3
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        with:
          prompt-file: ./prompts/failure-summary.prompt.yml
          # file_input injects the log file's *contents* into the {{log}} variable.
          file_input: |
            log: ./excerpt.log

      - name: Publish to job summary
        env:
          AI_RESPONSE: ${{ steps.ai.outputs.response }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          {
            echo "## 🤖 AI diagnosis of failed CI run"
            echo ""
            echo "Failed run: $RUN_URL"
            echo ""
            echo "$AI_RESPONSE"
            echo ""
            echo "_Generated by Copilot in Actions — verify before acting._"
          } >> "$GITHUB_STEP_SUMMARY"
