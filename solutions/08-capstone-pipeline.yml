# Lab 8 solution — the full CI/CD capstone pipeline.
#   lint ─┐
#         ├─→ build → package (GHCR) → deploy-staging → deploy-production 🔒
#   test ─┘
# CI jobs cancel when you push again; deploy jobs never do (job-level
# concurrency). Package/deploy only run for pushes to main.
name: Pipeline

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pipeline-ci-lint-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # super-linter diffs against the base to find changed files

      - name: Run super-linter (slim)
        uses: super-linter/super-linter/slim@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_YAML: true

  test:
    name: Test on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pipeline-ci-test-${{ github.ref }}-${{ matrix.node-version }}
      cancel-in-progress: true
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - run: npm test

  build:
    name: Build distributable
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - run: npm run build # stamps dist/src/build-info.json with run number + sha

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: app/dist/
          retention-days: 7

  package:
    name: Package → GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # lets the GITHUB_TOKEN push to ghcr.io
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push image
        id: push
        working-directory: app
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"   # image names must be lowercase
          docker build -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" \
            --build-arg GITHUB_SHA="${GITHUB_SHA}" \
            --build-arg GITHUB_RUN_NUMBER="${GITHUB_RUN_NUMBER}" .
          docker push --all-tags "$IMAGE"
          echo "image=$IMAGE:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy-staging:
    name: Deploy to staging
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pipeline-deploy # deploys queue behind each other, never cancel
      cancel-in-progress: false
    environment:
      name: staging
      url: https://staging.example.com
    steps:
      - name: Pull and smoke-test
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker run -d --rm -p 3000:3000 --name app "${{ needs.package.outputs.image }}"
          sleep 3
          echo "Health payload from the running container:"
          curl --fail --silent http://localhost:3000/health
          echo
          docker stop app

  deploy-production:
    name: Deploy to production
    needs: [package, deploy-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pipeline-deploy
      cancel-in-progress: false
    environment:
      name: production # ⏸️ waits for the required reviewer
      url: https://prod.example.com
    steps:
      - name: Pull and smoke-test
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker run -d --rm -p 3000:3000 --name app "${{ needs.package.outputs.image }}"
          sleep 3
          echo "Health payload from the running container:"
          curl --fail --silent http://localhost:3000/health
          echo
          docker stop app

      - name: Traceability
        run: echo "Commit ${{ github.sha }} is now 'in production' as image ${{ needs.package.outputs.image }}"
