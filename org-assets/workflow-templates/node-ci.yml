# Starter workflow template (Lab 4 instructor demo).
# To activate: copy the workflow-templates/ folder into a repository named
# `.github` at the ORGANIZATION level. This template then appears on every
# org repo's Actions → "New workflow" page next to GitHub's own starters.
# $default-branch$ is substituted with the repo's default branch on use.
name: Node CI (Org Starter)

on:
  push:
    branches: [$default-branch$]
  pull_request:
    branches: [$default-branch$]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm test
