# Pre-provisions the ephemeral environment Copilot coding agent works in
# (Lab 10). The file name and job name are contracts: GitHub only picks this
# up as .github/workflows/copilot-setup-steps.yml on the default branch, and
# the job MUST be called `copilot-setup-steps`.
#
# It also runs as a normal workflow on pushes/PRs that modify it, so you can
# verify it works before the agent ever uses it.
name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # platform cap for this job is 59
    # Copilot gets its own token for its work; this job only needs to read
    # the repo to install dependencies.
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Prove the toolchain works
        working-directory: app
        run: npm test
