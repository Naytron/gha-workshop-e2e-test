name: Secrets Demo
on: workflow_dispatch

permissions:
  contents: read

jobs:
  show-masking:
    runs-on: ubuntu-latest
    steps:
      - name: Use the secret
        env:
          API_KEY: ${{ secrets.DEMO_API_KEY }}   # pass via env, not inline
        run: |
          echo "The key is $API_KEY"
          echo "Key length: ${#API_KEY}"
