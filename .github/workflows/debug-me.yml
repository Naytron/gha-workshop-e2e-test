# ⚠️ THIS WORKFLOW IS INTENTIONALLY BROKEN. ⚠️
# It contains three bugs. Lab 1 walks you through finding each one using the
# workflow logs — run it manually from the Actions tab, read the error, fix,
# re-run, repeat. Resist the urge to peek at solutions/01-debug-me-fixed.yml!
name: Debug Me (broken on purpose)

on:
  workflow_dispatch:

jobs:
  test:
    name: Test the app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run the tests
        run: npm test
