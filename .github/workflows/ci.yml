name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run the tests
        run: npm test

      - name: Expression playground
        run: |
          echo "1. ${{ contains(github.repository, 'workshop') }}"
          echo "2. ${{ format('Run #{0} attempt {1}', github.run_number, github.run_attempt) }}"
          echo "3. ${{ startsWith(github.ref, 'refs/heads/') && 'branch' || 'not a branch' }}"
          echo "4. hashFiles: ${{ hashFiles('app/package-lock.json') }}"

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npm run build

      - name: Show build metadata
        run: cat dist/src/build-info.json
